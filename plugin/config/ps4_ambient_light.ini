[network]
; The real WLED controller's IP -- NOT this PC's own IP.
wled_host=
wled_port=4048
; Advanced/optional: only relevant if you're also running the
; wled-relay companion project and want this plugin to tell it
; when it's driving the TV backlight WLED controller above
; directly, so that project's own audio-reactive effects don't
; fight this plugin for the same strip during a real game. OFF
; by default -- most users don't run that project and don't
; need this. Not part of this default file at all -- add
; relay_signal_enabled/relay_host/relay_port yourself, here in
; [network], only if you're actually running wled-relay.

[layout]
; Physical LED counts per screen edge. Defaults match this
; project's own measured strip (73/41/73/42 = 229 total).
led_count_top=73
led_count_right=41
led_count_bottom=73
led_count_left=42
; Which corner physical LED index 0 sits at, and which way the
; strip runs from there. Valid led_start_corner: bottom_left,
; bottom_right, top_left, top_right. Valid led_direction:
; clockwise, counterclockwise.
led_start_corner=bottom_left
led_direction=clockwise
; If the light show is correct but rotated around the border
; (e.g. everything is one LED off from where it should be),
; adjust this instead of led_start_corner/led_direction.
led_offset=0
; Pixels to inset sampling from the true screen edge, per side.
; Raise these if overscan/black bars are being sampled instead
; of real picture content.
capture_margin_top=0
capture_margin_right=0
capture_margin_bottom=0
capture_margin_left=0
; Sample radius per zone: (2*scan_depth+1)^2 pixels averaged.
; Higher = smoother/less noisy but more CPU per frame.
scan_depth=1

[color]
; Global brightness scale, 0-255. 255 = no change.
brightness=255
; Must be exactly one of: 1.0 1.4 1.8 2.0 2.2 2.4 2.6 2.8
; (precomputed lookup tables -- no other value is accepted).
gamma=1.0
; -100 (grayscale) to 300 (4x color boost, mostly clipped by
; then -- verified overflow-safe well beyond this, the cap is
; just where it stops looking meaningfully different).
; 0 = unchanged.
saturation=0
; Match your strip's actual wiring. Valid values: RGB, RBG,
; GRB, GBR, BRG, BGR. Most WS2812B/NeoPixel strips are GRB.
color_order=RGB
; Levels adjustment (0-100, percent of the 0-255 range).
; Anything at/below black_level becomes 0; anything at/above
; white_level becomes 255; the rest stretches to fill the gap.
; Defaults (0, 100) are a no-op.
black_level=0
white_level=100
; If a zone's brightest channel drops below this (0-255), that
; zone is forced fully black instead of showing a faint/noisy
; near-black color. Has built-in hysteresis (must rise 10 above
; this value again before turning back on) so it won't flicker
; on scenes hovering right at the threshold. 0 = disabled.
dark_threshold=0
; --- Below this line: ported from the Android version's own
; per-channel color engine. NOTE THE DIFFERENT CONVENTION: these
; use Android's "100 = unchanged" percent scale, NOT this file's
; usual "0 = unchanged" scale used by saturation/brightness above.
; Contrast: -100..300, 0 = unchanged (stretches/shrinks around
; mid-grey 128, same math as saturation but around brightness
; instead of hue).
contrast=0
; Per-channel brightness, 0-500, 100 = unchanged. Multiplies with
; the single [color] brightness above rather than replacing it.
brightness_r=100
brightness_g=100
brightness_b=100
; Per-channel gamma, 10-500, 100 = unchanged. Unlike the fixed
; gamma= list above (8 preset curves, shared across all 3
; channels), these accept ANY value in range and are independent
; per channel. Applied PER SAMPLE PIXEL before zone-averaging,
; not to the already-averaged zone color -- matches how the
; Android version does it, and avoids a single stray bright
; pixel in an otherwise-dark zone getting averaged in BEFORE
; being gamma-crushed.
gamma_r=100
gamma_g=100
gamma_b=100

[timing]
; How many times per second to sample and send color.
update_frequency_hz=30
; Blend each new sample with the previous one over roughly
; settling_time_ms, instead of snapping instantly -- reduces
; flicker on fast scene cuts. false = send raw samples as-is.
smoothing_enabled=false
settling_time_ms=200
; How often (seconds) to check this file for changes WHILE
; RUNNING and apply them live -- no need to close/reopen the
; game. 0 = only read this file once, at plugin load (the
; original v2.0 behavior).
config_reload_check_seconds=2
