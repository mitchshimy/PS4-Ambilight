[network]
; The real WLED controller's IP -- NOT this PC's own IP.
wled_host=
wled_port=4048

[layout]
; Physical LED counts per screen edge. Defaults match this
; project's own measured strip (73/41/73/42 = 229 total).
led_count_top=73
led_count_right=41
led_count_bottom=73
led_count_left=42
; Which corner physical LED index 0 sits at, and which way the
; strip runs from there. Valid led_start_corner: bottom_left,
; bottom_right, top_left, top_right. Valid led_direction:
; clockwise, counterclockwise.
led_start_corner=bottom_left
led_direction=clockwise
; If the light show is correct but rotated around the border
; (e.g. everything is one LED off from where it should be),
; adjust this instead of led_start_corner/led_direction.
led_offset=0
; Two more keys can be added here by hand. They are left out of this file
; and of the companion app because they are tuned together with the
; detection scan, so they are only written if someone changes them.
; auto_letterbox_stability_frames (default 3):
; How many consecutive detections must agree before a new
; border is actually applied -- higher = slower to react but
; more resistant to flicker across a scene cut.
; auto_letterbox_check_interval_frames (default 15):
; How many sample-thread passes to wait between re-checks. Each
; check probes every edge inward (up to 180px from top/bottom,
; 320px from left/right) with several tiled reads per line, so
; it isn't free -- raise this if update_frequency_hz is high and
; CPU headroom is tight.

[color]
; Match your strip's actual wiring. Valid values: RGB, RBG,
; GRB, GBR, BRG, BGR. Most WS2812B/NeoPixel strips are GRB.
color_order=RGB

[timing]
; How many times per second to sample and send color.
update_frequency_hz=30
; How often (seconds) to check this file for changes WHILE
; RUNNING and apply them live -- no need to close/reopen the
; game. 0 = only read this file once, at plugin load (the
; original v2.0 behavior).
config_reload_check_seconds=2

[presets]
; Which preset runs: game or movie. The companion app changes
; this. Apps listed in media_titles.h (plugin source) always run
; movie, whatever this says.
; Each preset is a complete set of the values below. A preset
; section that exists is used as-is: a key missing from it keeps
; the plugin's built-in default. If neither section exists (an
; ini from before v3.8) the same keys are read from [layout],
; [color] and [timing] as they used to be.
active=game

[preset_game]
; Sample radius per zone: (2*scan_depth+1)^2 pixels averaged.
; Higher = smoother/less noisy but more CPU per frame. Capped
; at 4 -- values above that are rejected and the previous
; value is kept.
scan_depth=2
; Auto-detects black letterbox/pillarbox bars and insets
; sampling to stay off them, per edge independently (so e.g.
; a status bar only on top is handled correctly). This is the
; ONLY sampling inset the plugin applies -- there's no manual
; margin setting -- so leave this on unless you have a
; specific reason to sample every pixel unconditionally.
auto_letterbox_enabled=true
; A probed pixel counts as part of a black bar if every
; channel is below this (0-255).
auto_letterbox_threshold=18
; Global brightness scale, 0-255. 255 = no change.
brightness=255
; -100 (grayscale) to 100 (2x color boost). 0 = unchanged. Past
; 100 most colors clip at 255/0 and stop looking different, so
; values above 100 are clamped to 100.
saturation=35
; Must be exactly one of: 1.0 1.4 1.8 2.0 2.2 2.4 2.6 2.8
; (precomputed lookup tables -- no other value is accepted).
; Applied on top of WLED's own gamma if that is enabled for
; realtime data, so turn WLED's colour gamma off.
gamma=2.2
; Levels adjustment (0-100, percent of the 0-255 range).
; Anything at/below black_level becomes 0; anything at/above
; white_level becomes 255; the rest stretches to fill the gap.
; Defaults (0, 100) are a no-op.
black_level=0
white_level=100
; Contrast: -100..100, 0 = unchanged (stretches/shrinks around
; mid-grey 128, same math as saturation but around brightness
; instead of hue). At 100 (2x) half the tonal range already
; clips to black/white, so values above 100 are clamped.
contrast=0
; Blend each new sample with the previous one over roughly
; settling_time_ms, instead of snapping instantly -- reduces
; flicker on fast scene cuts. false = send raw samples as-is.
smoothing_enabled=true
settling_time_ms=50
; If a zone's brightest channel drops below this (0-255), that
; zone is forced fully black instead of showing a faint/noisy
; near-black color. Has built-in hysteresis (must rise 10 above
; this value again before turning back on) so it won't flicker
; on scenes hovering right at the threshold. 0 = disabled.
dark_threshold=0
; --- Per-channel values, ported from the Android version's own
; per-channel color engine. NOTE THE DIFFERENT CONVENTION: these
; use Android's "100 = unchanged" percent scale, NOT this file's
; usual "0 = unchanged" scale used by saturation/brightness above.
; Per-channel brightness, 0-500, 100 = unchanged. Multiplies with
; the single brightness above rather than replacing it.
brightness_r=100
brightness_g=100
brightness_b=100
; Per-channel gamma, 10-500, 100 = unchanged. Unlike the fixed
; gamma= list above (8 preset curves, shared across all 3
; channels), these accept ANY value in range and are independent
; per channel. Applied PER SAMPLE PIXEL before zone-averaging,
; not to the already-averaged zone color -- matches how the
; Android version does it, and avoids a single stray bright
; pixel in an otherwise-dark zone getting averaged in BEFORE
; being gamma-crushed.
gamma_r=100
gamma_g=100
gamma_b=100

[preset_movie]
; Same keys and ranges as [preset_game] above; see the comments there.
scan_depth=4
auto_letterbox_enabled=true
auto_letterbox_threshold=18
brightness=204
saturation=25
gamma=2.4
black_level=1
white_level=100
contrast=0
smoothing_enabled=true
settling_time_ms=200
dark_threshold=0
brightness_r=100
brightness_g=100
brightness_b=100
gamma_r=100
gamma_g=100
gamma_b=100
