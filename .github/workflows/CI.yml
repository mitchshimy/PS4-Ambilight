name: Build plugin + companion app

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build_prx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      # payloads/CHECKSUMS.md is what people verify ps4-ambilight.bin against, and the release attaches that...
      # More: docs/code-comments.md (.github/workflows/CI.yml:23)
      - name: Check payloads/CHECKSUMS.md matches the Ambilight payload
        run: sh tools/update_payload_checksum.sh --check

      # On a tag push, the tag has to name the version the plugin says it is, so tagging v3.5.0 can't ship a...
      # More: docs/code-comments.md (.github/workflows/CI.yml:29)
      - name: Check tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          raw=$(sed -n 's/.*g_pluginVersion *= *0x\([0-9A-Fa-f]*\).*/\1/p' plugin/source/hooks.c | head -n1)
          if [ -z "$raw" ]; then
            echo "::error::couldn't read g_pluginVersion from plugin/source/hooks.c"
            exit 1
          fi
          val=$((16#$raw))
          want="$(( (val >> 8) & 255 )).$(( val & 255 ))"
          # Allows an optional "-rc.N" pre-release suffix (e.g. v3.9.4-rc1) so a shell-feed hardware test build...
          # More: docs/code-comments.md (.github/workflows/CI.yml:46)
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+(\.[0-9]+)?(-rc\.?[0-9]+)?$'; then
            echo "::error::tag '$tag' isn't a version tag like v$want.0 or v$want.0-rc1"
            exit 1
          fi
          have=$(printf '%s' "${tag#v}" | cut -d. -f1,2)
          if [ "$have" != "$want" ]; then
            echo "::error::tag $tag is version $have but hooks.c says $want (g_pluginVersion=0x$raw). Bump one to match, delete the tag and tag again."
            exit 1
          fi
          echo "tag $tag matches plugin version $want"

      - name: Checkout GoldHEN SDK
        uses: actions/checkout@main
        with:
          repository: GoldHEN/GoldHEN_Plugins_SDK
          path: SDK

      # Upstream's 64-bit detour path has real bugs (wrong instruction size, wrong jump-write variant, and a...
      # More: docs/code-comments.md (.github/workflows/CI.yml:69)
      - name: Patch GoldHEN SDK
        working-directory: SDK
        run: patch -p1 < ../patches/goldhen-sdk-detour64-fix.patch

      - name: Setup variables
        run: |
          sudo apt install -y llvm lld
          # The 'llvm' package on ubuntu-latest only installs versioned binaries (llvm-ar-NN), not an...
          # More: docs/code-comments.md (.github/workflows/CI.yml:84)
          sudo ln -sf "$(command -v llvm-ar || ls /usr/bin/llvm-ar-* | sort -V | tail -1)" /usr/local/bin/llvm-ar
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV

      - name: Download OpenOrbis Toolchain
        run: curl -sL https://github.com/illusion0001/OpenOrbis-PS4-Toolchain/releases/latest/download/toolchain.tar.gz | tar xz -C ./

      - name: Export path to SDK
        working-directory: SDK
        run: echo "GOLDHEN_SDK=$(pwd)" >> $GITHUB_ENV

      - name: Build GoldHEN SDK
        # Produces SDK/build/crtprx.o and SDK/libGoldHEN_Hook.a, which the
        # plugin links against. Not prebuilt in the SDK repo.
        working-directory: SDK
        run: make

      - name: Build (Release)
        working-directory: plugin
        run: make

      - name: Build (Debug)
        working-directory: plugin
        run: make DEBUG=1

      # shell-feed Stage A: built against the same patched SDK, same toolchain env, as the Stage-A merge...
      # More: docs/code-comments.md (.github/workflows/CI.yml:111)
      - name: Build shell-feed (Release)
        working-directory: shell-feed
        run: make

      - name: Build shell-feed (Debug)
        working-directory: shell-feed
        run: make DEBUG=1

      - name: Upload plugin (Release)
        uses: actions/upload-artifact@main
        with:
          name: ps4_ambient_light-prx_final
          path: bin/plugins/prx_final/ps4_ambient_light.prx
          if-no-files-found: error

      - name: Upload plugin (Debug)
        uses: actions/upload-artifact@main
        with:
          name: ps4_ambient_light-prx_debug
          path: bin/plugins/prx_debug/ps4_ambient_light.prx
          if-no-files-found: error

      - name: Upload shell-feed (Release)
        uses: actions/upload-artifact@main
        with:
          name: ps4_shell_feed-prx_final
          path: bin/plugins/prx_final/ps4_shell_feed.prx
          if-no-files-found: error

      - name: Upload shell-feed (Debug)
        uses: actions/upload-artifact@main
        with:
          name: ps4_shell_feed-prx_debug
          path: bin/plugins/prx_debug/ps4_shell_feed.prx
          if-no-files-found: error

  build_pkg:
    # PkgTool.Core's pkg_build subcommand (unlike sfo_new/sfo_setentry, which don't touch OpenSSL) needs...
    # More: docs/code-comments.md (.github/workflows/CI.yml:155)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup variables
        run: |
          sudo apt install -y llvm lld
          sudo ln -sf "$(command -v llvm-ar || ls /usr/bin/llvm-ar-* | sort -V | tail -1)" /usr/local/bin/llvm-ar
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV
          # PkgTool.Core is a self-contained .NET build that otherwise crashes on a bare runner looking for ICU...
          # More: docs/code-comments.md (.github/workflows/CI.yml:173)
          echo "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1" >> $GITHUB_ENV

      - name: Download OpenOrbis Toolchain
        run: curl -sL https://github.com/illusion0001/OpenOrbis-PS4-Toolchain/releases/latest/download/toolchain.tar.gz | tar xz -C ./

      - name: Make Linux toolchain binaries executable
        # The release tarball doesn't reliably preserve the executable bit for the Linux tools...
        # More: docs/code-comments.md (.github/workflows/CI.yml:182)
        run: chmod +x "$OO_PS4_TOOLCHAIN"/bin/linux/*

      - name: Compile
        # Linux equivalent of build.bat's compile loop.
        # More: docs/code-comments.md (.github/workflows/CI.yml:188)
        working-directory: companion-app
        run: |
          mkdir -p build/int
          for f in source/*.c; do
            clang --target=x86_64-pc-freebsd12-elf -fPIC -funwind-tables \
              -I"$OO_PS4_TOOLCHAIN/include" -I"$OO_PS4_TOOLCHAIN/include/c++/v1" -Iinclude \
              -c -o "build/int/$(basename "${f%.c}").o" "$f"
          done

      - name: Link
        working-directory: companion-app
        env:
          LIBRARIES: >-
            -lc -lkernel -lc++ -lSceUserService -lSceVideoOut -lSceAudioOut -lScePad
            -lSceSysmodule -lSceFreeType -lSDL2 -lSceNet -lSceSsl -lSceHttp
            -lSceCommonDialog -lSceImeDialog -lSceSystemService
        run: |
          ld.lld -m elf_x86_64 -pie --script "$OO_PS4_TOOLCHAIN/link.x" --eh-frame-hdr \
            -o build/eboot.elf "-L$OO_PS4_TOOLCHAIN/lib" $LIBRARIES \
            "$OO_PS4_TOOLCHAIN/lib/crt1.o" build/int/*.o

      - name: Create self + param.sfo
        working-directory: companion-app
        run: |
          "$OO_PS4_TOOLCHAIN/bin/linux/create-fself" -in build/eboot.elf --out build/eboot.oelf --eboot eboot.bin --paid 0x3800000000000011

          # The version comes from the one line in include/app_version.h (also shown on Help).
          APP_VERSION=$(sed -n 's/^#define APP_VERSION "\([0-9.]*\)".*/\1/p' include/app_version.h)
          if [ -z "$APP_VERSION" ]; then echo "::error::no '#define APP_VERSION \"N.NN\"' line in companion-app/include/app_version.h"; exit 1; fi
          echo "Package version $APP_VERSION"

          PT="$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"
          "$PT" sfo_new sce_sys/param.sfo
          "$PT" sfo_setentry sce_sys/param.sfo APP_TYPE --type Integer --maxsize 4 --value 1
          "$PT" sfo_setentry sce_sys/param.sfo APP_VER --type Utf8 --maxsize 8 --value "$APP_VERSION"
          "$PT" sfo_setentry sce_sys/param.sfo ATTRIBUTE --type Integer --maxsize 4 --value 2
          "$PT" sfo_setentry sce_sys/param.sfo CATEGORY --type Utf8 --maxsize 4 --value "gd"
          "$PT" sfo_setentry sce_sys/param.sfo CONTENT_ID --type Utf8 --maxsize 48 --value "IV0000-SHMY00091_00-PS4AMBILIGHT0000"
          "$PT" sfo_setentry sce_sys/param.sfo DOWNLOAD_DATA_SIZE --type Integer --maxsize 4 --value 0
          "$PT" sfo_setentry sce_sys/param.sfo SYSTEM_VER --type Integer --maxsize 4 --value 0
          "$PT" sfo_setentry sce_sys/param.sfo TITLE --type Utf8 --maxsize 128 --value "PS4 Ambilight"
          "$PT" sfo_setentry sce_sys/param.sfo TITLE_ID --type Utf8 --maxsize 12 --value "SHMY00091"
          "$PT" sfo_setentry sce_sys/param.sfo VERSION --type Utf8 --maxsize 8 --value "$APP_VERSION"

      - name: Build package
        working-directory: companion-app
        run: |
          MODULE_FILES=$(cd sce_module && printf 'sce_module/%s ' *)
          FONT_FILES=$(cd assets/fonts && printf 'assets/fonts/%s ' *)

          "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4" -out pkg.gp4 \
            --content-id="IV0000-SHMY00091_00-PS4AMBILIGHT0000" \
            --files "eboot.bin sce_sys/about/right.sprx sce_sys/param.sfo sce_sys/icon0.png $MODULE_FILES $FONT_FILES"

          mkdir -p pkg_out
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" pkg_build pkg.gp4 pkg_out

      - name: Upload companion app package
        uses: actions/upload-artifact@main
        with:
          name: ps4_ambient_light-companion_pkg
          path: companion-app/pkg_out/*.pkg
          if-no-files-found: error

  # Separate from both build jobs so build_prx and build_pkg can run in parallel: this job just waits on...
  # More: docs/code-comments.md (.github/workflows/CI.yml:257)
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build_prx, build_pkg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only for payloads/ and the script that checks it: the Ambilight payload (ps4-ambilight.bin) is a...
      # More: docs/code-comments.md (.github/workflows/CI.yml:268)
      - name: Checkout (payloads and tools only)
        uses: actions/checkout@main
        with:
          sparse-checkout: |
            payloads
            tools
          sparse-checkout-cone-mode: true

      - name: Download plugin (Release)
        uses: actions/download-artifact@main
        with:
          name: ps4_ambient_light-prx_final
          path: prx

      - name: Download shell-feed (Release)
        uses: actions/download-artifact@main
        with:
          name: ps4_shell_feed-prx_final
          path: prx

      - name: Download companion app package
        uses: actions/download-artifact@main
        with:
          name: ps4_ambient_light-companion_pkg
          path: pkg

      # Only the Release .prx is ever fetched by anything at runtime -- companion-app/source/main.c's...
      # More: docs/code-comments.md (.github/workflows/CI.yml:297)
      - name: Compute checksums
        working-directory: prx
        run: |
          sha256sum ps4_ambient_light.prx > ps4_ambient_light.prx.sha256
          sha256sum ps4_shell_feed.prx > ps4_shell_feed.prx.sha256

      # The Ambilight payload (payloads/ps4-ambilight.bin).
      # More: docs/code-comments.md (.github/workflows/CI.yml:315)
      - name: Verify and checksum the Ambilight payload
        run: |
          set -eu
          sh tools/update_payload_checksum.sh --check
          cd payloads
          sha256sum ps4-ambilight.bin > ps4-ambilight.bin.sha256
          cat ps4-ambilight.bin.sha256

      # A tag like v3.9.4-rc1 passes the build_prx version check (see its comment) but must never become the...
      # More: docs/code-comments.md (.github/workflows/CI.yml:328)
      - name: Determine prerelease flag
        id: prerelease
        run: |
          case "$GITHUB_REF_NAME" in
            *-rc*) echo "flag=true" >> "$GITHUB_OUTPUT" ;;
            *)     echo "flag=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.prerelease.outputs.flag }}
          files: |
            prx/ps4_ambient_light.prx
            prx/ps4_ambient_light.prx.sha256
            prx/ps4_shell_feed.prx
            prx/ps4_shell_feed.prx.sha256
            payloads/ps4-ambilight.bin
            payloads/ps4-ambilight.bin.sha256
            pkg/*.pkg
