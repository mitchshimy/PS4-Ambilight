name: Build plugin

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build_prx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Checkout GoldHEN SDK
        uses: actions/checkout@main
        with:
          repository: GoldHEN/GoldHEN_Plugins_SDK
          path: SDK

      - name: Setup variables
        run: |
          sudo apt install -y llvm lld
          # The 'llvm' package on ubuntu-latest only installs versioned
          # binaries (llvm-ar-NN), not an unversioned 'llvm-ar' -- and the
          # GoldHEN SDK's Makefile calls the unversioned name.
          sudo ln -sf "$(command -v llvm-ar || ls /usr/bin/llvm-ar-* | sort -V | tail -1)" /usr/local/bin/llvm-ar
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV

      - name: Download OpenOrbis Toolchain
        run: curl -sL https://github.com/illusion0001/OpenOrbis-PS4-Toolchain/releases/latest/download/toolchain.tar.gz | tar xz -C ./

      - name: Export path to SDK
        working-directory: SDK
        run: echo "GOLDHEN_SDK=$(pwd)" >> $GITHUB_ENV

      - name: Build GoldHEN SDK
        # Produces SDK/build/crtprx.o and SDK/libGoldHEN_Hook.a, which the
        # plugin links against. Not prebuilt in the SDK repo.
        working-directory: SDK
        run: make

      - name: Build (Release)
        working-directory: plugin
        run: make

      - name: Build (Debug)
        working-directory: plugin
        run: make DEBUG=1

      - name: Upload plugin (Release)
        uses: actions/upload-artifact@main
        with:
          name: ps4_ambient_light-prx_final
          path: bin/plugins/prx_final/*.prx
          if-no-files-found: error

      - name: Upload plugin (Debug)
        uses: actions/upload-artifact@main
        with:
          name: ps4_ambient_light-prx_debug
          path: bin/plugins/prx_debug/*.prx
          if-no-files-found: error
